name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CSVReader-debug-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CSVReader-debug-apk
          path: CSVReader-debug-*.apk

      # A release gives a direct .apk link that opens on the phone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Debug build ${{ github.run_number }}
          prerelease: true
          files: CSVReader-debug-*.apk
